name: Release

# Builds a universal Melicum.app, signs it and the system volume driver with a
# Developer ID, notarizes and staples the app and the disk image, and attaches
# them to a draft GitHub release. Secret names match the Tabularis workflow so
# the same Apple credentials can be reused.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag/release name (e.g. v0.3.0). The tag is created on the built commit if it does not exist."
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag_name || github.ref_name }}
      MELICUM_ARCHS: "arm64 x86_64"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      # Release builds must be signed and notarized; a partial set of secrets
      # would fail half-way, so refuse early with a clear message instead.
      - name: Check signing secrets
        env:
          HAS_SECRETS: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_CONTENT != '' }}
        run: |
          if [ "$HAS_SECRETS" != "true" ]; then
            echo "::error::Release builds require APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_API_ISSUER, APPLE_API_KEY and APPLE_API_KEY_CONTENT."
            exit 1
          fi

      - name: Set version from tag
        run: |
          version="${TAG#v}"
          plutil -replace CFBundleShortVersionString -string "$version" Resources/Info.plist
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" Resources/Info.plist
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: |
          swift test
          mkdir -p build
          xcrun clang -std=c11 -fblocks Driver/Tests.c -framework CoreAudio -framework CoreFoundation -framework Accelerate -o build/driver-tests
          ./build/driver-tests

      # The .p12 holds the Developer ID Application certificate (and optionally
      # the Developer ID Installer one); it lives in a throwaway keychain.
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      # Notarization uses the App Store Connect API key, stored base64-encoded.
      - name: Prepare Apple API key
        run: |
          echo "${{ secrets.APPLE_API_KEY_CONTENT }}" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"

      - name: Build and sign
        env:
          MELICUM_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MELICUM_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
        run: |
          zsh scripts/build-system-volume.sh
          zsh scripts/build.sh
          codesign --verify --deep --strict --verbose=2 build/Melicum.app

      - name: Notarize app
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          ditto -c -k --keepParent build/Melicum.app build/Melicum-notarize.zip
          xcrun notarytool submit build/Melicum-notarize.zip --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple build/Melicum.app
          spctl --assess --type execute --verbose=2 build/Melicum.app

      - name: Package disk image and archive
        env:
          MELICUM_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p dist build/dmg
          ditto build/Melicum.app build/dmg/Melicum.app
          ln -s /Applications build/dmg/Applications
          dmg="dist/Melicum-$VERSION.dmg"
          hdiutil create -volname Melicum -srcfolder build/dmg -format UDZO -ov "$dmg"
          codesign --force --timestamp --sign "$MELICUM_SIGN_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          ditto -c -k --keepParent build/Melicum.app "dist/Melicum-$VERSION.zip"
          (cd dist && shasum -a 256 * > SHA256SUMS.txt)

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --generate-notes --target "$GITHUB_SHA" --title "Melicum $VERSION" "${prerelease[@]}"
          fi

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/apple_api_key.p8"
