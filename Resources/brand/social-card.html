<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Melicum social card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=block">
<style>
/* 1280 by 640 card for Open Graph and the GitHub social preview; keep text inside the 1200 px center for 1.91:1 crops. */
:root { --bg: #18181C; --bg-deep: #111114; --line: #34343C; --cream: #F3EDE2; --muted: #9C968D; --red: #FF5A47; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: var(--bg); color: var(--cream); -webkit-font-smoothing: antialiased; }
.card { position: relative; width: 1280px; height: 640px; overflow: hidden; background: radial-gradient(70% 90% at 78% 40%, rgba(255,90,71,.16), transparent 65%), linear-gradient(180deg, var(--bg), var(--bg-deep)); }
.copy { position: absolute; left: 96px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
.mark { width: 104px; height: auto; margin-left: -6px; }
h1 { margin: 0; font: 600 112px/.9 "Fraunces", Georgia, serif; letter-spacing: -.02em; }
.lede { margin: 0; font: 400 32px/1.25 "IBM Plex Sans", sans-serif; color: var(--muted); }
.lede b { color: var(--cream); font-weight: 500; }
.foot { display: flex; align-items: center; gap: 14px; font: 500 18px/1 "IBM Plex Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.foot::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--red); }
.window { position: absolute; left: 700px; top: 92px; width: 720px; height: 456px; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 40px 90px rgba(0,0,0,.6); background: url("../../docs/images/main-window.png") 0 0 / 720px auto no-repeat var(--bg); }
</style>
</head>
<body>
<div class="card">
  <div class="copy">
    <img class="mark" src="melicum-mark-dark.svg" alt="">
    <h1>Melicum</h1>
    <p class="lede"><b>HDMI and DisplayPort volume</b> for macOS, with native volume keys.</p>
    <div class="foot">melicum.app · Free and open source</div>
  </div>
  <div class="window"></div>
</div>
</body>
</html>
